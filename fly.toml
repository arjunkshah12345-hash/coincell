# fly.io config — Haloscan API + clinical UI
app = "haloscan"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  HALOSCAN_WEIGHTS = "/app/weights/haloscan.pt"
  PORT = "7860"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "120s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
